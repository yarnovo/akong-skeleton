<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>aily-ui Skeleton · demo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/yarnovo/aily-ui-tokens@main/src/tokens.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/yarnovo/aily-ui-tokens@main/src/tokens.dark.css" />
<link rel="stylesheet" href="../src/Skeleton.css" />
<style>
  body {
    font-family: var(--ak-font-sans);
    background: var(--ak-bg);
    color: var(--ak-fg);
    margin: 0;
    padding: var(--ak-space-6);
    max-width: 760px;
    margin-inline: auto;
    transition: background var(--ak-duration-base) var(--ak-ease-out), color var(--ak-duration-base) var(--ak-ease-out);
  }
  h1 { font-size: var(--ak-text-2xl); font-weight: var(--ak-weight-semibold); letter-spacing: var(--ak-tracking-tight); margin: 0 0 var(--ak-space-2); }
  .sub { color: var(--ak-fg-subtle); font-size: var(--ak-text-sm); margin-bottom: var(--ak-space-8); }
  h2 { font-size: var(--ak-text-md); font-weight: var(--ak-weight-semibold); margin: var(--ak-space-8) 0 var(--ak-space-3); }
  .col-label { color: var(--ak-fg-subtle); font-size: var(--ak-text-xs); margin-bottom: var(--ak-space-2); }
  .panel { padding: var(--ak-space-4); background: var(--ak-bg-elevated); border: 1px solid var(--ak-border-subtle); border-radius: var(--ak-radius-md); }
  .stack > * + * { margin-top: var(--ak-space-2); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--ak-space-4); }
  .card { display: flex; gap: var(--ak-space-3); align-items: flex-start; padding: var(--ak-space-4); border: 1px solid var(--ak-border-subtle); border-radius: var(--ak-radius-md); background: var(--ak-bg-elevated); }
  .card .body { flex: 1; }
  .toggle { position: fixed; top: 64px; right: 16px; padding: 8px 12px; border-radius: var(--ak-radius-full); background: var(--ak-fg); color: var(--ak-bg); border: 0; font-size: var(--ak-text-sm); cursor: pointer; }
  .back-to-index {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    padding: 8px 16px;
    background: var(--ak-bg-elevated);
    border: 1px solid var(--ak-border-subtle);
    border-radius: var(--ak-radius-full);
    color: var(--ak-fg-muted);
    text-decoration: none;
    font-size: var(--ak-text-sm);
    box-shadow: var(--ak-shadow-sm);
    transition: all 0.2s;
  }
  .back-to-index:hover {
    background: var(--ak-bg-hover);
    color: var(--ak-fg);
  }
</style>
</head>
<body>
  <a href="https://yarnovo.github.io/aily-ui-core/" class="back-to-index">← 回 aily-ui 总站</a>
  <button class="toggle" id="t">切换暗色</button>
  <h1>aily-ui Skeleton</h1>
  <p class="sub">加载占位 · pulse / shimmer · 任意尺寸 · 跨 Web/RN · 一份 props</p>

  <h2>Variants</h2>
  <div class="grid-2">
    <div class="panel">
      <div class="col-label">pulse (默认 · opacity 0.5 ↔ 1)</div>
      <div class="ak-skeleton ak-skeleton--pulse ak-skeleton--radius-md" style="width: 100%; height: 16px;"></div>
    </div>
    <div class="panel">
      <div class="col-label">shimmer (linear-gradient 扫光)</div>
      <div class="ak-skeleton ak-skeleton--shimmer ak-skeleton--radius-md" style="width: 100%; height: 16px;"></div>
    </div>
  </div>

  <h2>Line (单行文字占位)</h2>
  <div class="panel stack">
    <div class="ak-skeleton ak-skeleton--pulse ak-skeleton--radius-sm" style="width: 100%; height: 14px;"></div>
    <div class="ak-skeleton ak-skeleton--pulse ak-skeleton--radius-sm" style="width: 80%;  height: 14px;"></div>
    <div class="ak-skeleton ak-skeleton--pulse ak-skeleton--radius-sm" style="width: 60%;  height: 14px;"></div>
  </div>

  <h2>Paragraph (多行 · shimmer)</h2>
  <div class="panel stack">
    <div class="ak-skeleton ak-skeleton--shimmer ak-skeleton--radius-sm" style="width: 100%; height: 12px;"></div>
    <div class="ak-skeleton ak-skeleton--shimmer ak-skeleton--radius-sm" style="width: 95%;  height: 12px;"></div>
    <div class="ak-skeleton ak-skeleton--shimmer ak-skeleton--radius-sm" style="width: 88%;  height: 12px;"></div>
    <div class="ak-skeleton ak-skeleton--shimmer ak-skeleton--radius-sm" style="width: 50%;  height: 12px;"></div>
  </div>

  <h2>Circle Avatar + 卡片</h2>
  <div class="card">
    <div class="ak-skeleton ak-skeleton--pulse ak-skeleton--radius-full" style="width: 48px; height: 48px;"></div>
    <div class="body stack">
      <div class="ak-skeleton ak-skeleton--pulse ak-skeleton--radius-sm" style="width: 40%; height: 16px;"></div>
      <div class="ak-skeleton ak-skeleton--pulse ak-skeleton--radius-sm" style="width: 25%; height: 12px;"></div>
      <div style="height: var(--ak-space-2)"></div>
      <div class="ak-skeleton ak-skeleton--pulse ak-skeleton--radius-sm" style="width: 100%; height: 12px;"></div>
      <div class="ak-skeleton ak-skeleton--pulse ak-skeleton--radius-sm" style="width: 90%;  height: 12px;"></div>
    </div>
  </div>

  <h2>Card (大块图 · shimmer)</h2>
  <div class="ak-skeleton ak-skeleton--shimmer ak-skeleton--radius-lg" style="width: 100%; height: 200px;"></div>

  <h2>Radii (sm / md / lg / full)</h2>
  <div class="panel" style="display: flex; gap: var(--ak-space-3); align-items: center;">
    <div class="ak-skeleton ak-skeleton--pulse ak-skeleton--radius-sm"   style="width: 64px; height: 64px;"></div>
    <div class="ak-skeleton ak-skeleton--pulse ak-skeleton--radius-md"   style="width: 64px; height: 64px;"></div>
    <div class="ak-skeleton ak-skeleton--pulse ak-skeleton--radius-lg"   style="width: 64px; height: 64px;"></div>
    <div class="ak-skeleton ak-skeleton--pulse ak-skeleton--radius-full" style="width: 64px; height: 64px;"></div>
  </div>

<script>
  document.getElementById('t').onclick = () => {
    document.documentElement.classList.toggle('dark')
  }
</script>
</body>
</html>
